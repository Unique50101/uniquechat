name: Verify and publish uniquechat
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to PyPI, GHCR and GitHub Releases
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: version
        run: python -c "import tomllib; print('version='+tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests && python tests/inference_smoke.py
      - if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os,importlib.metadata as m; assert os.environ['GITHUB_REF_NAME']=='v'+m.version('uniquechat')"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  pypi:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
  release:
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Attach verified Python distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi

  container:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/unique50101/uniquechat:${{ needs.verify.outputs.version }}
            ghcr.io/unique50101/uniquechat:latest

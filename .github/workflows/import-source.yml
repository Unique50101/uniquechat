name: Import uniquechat source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage source part 1
        run: echo '' >> /tmp/uniquechat.b64
      - name: Stage source part 2
        run: echo '' >> /tmp/uniquechat.b64
      - name: Import project files
        run: |
          base64 -d /tmp/uniquechat.b64 | tar -xJ
          python -m pip install pillow
          python render_walkthrough.py
          rm render_walkthrough.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import uniquechat package, tests, container and walkthrough'
          git push origin HEAD:main
